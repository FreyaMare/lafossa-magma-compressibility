name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest nbclient nbformat ipykernel
          python -m ipykernel install --user --name python3
      - name: Execute the notebook and check the results
        run: pytest -v tests/
